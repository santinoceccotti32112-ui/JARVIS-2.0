
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.A.R.V.I.S. 2.0</title>
<meta name="theme-color" content="#07111f">

<style>
*{box-sizing:border-box}
body{
margin:0;
background:radial-gradient(circle at top,#12334d,#07111f 65%);
color:#eaf6ff;
font:16px system-ui;
min-height:100vh
}
main{max-width:720px;margin:auto;padding:24px 16px}
.head{text-align:center;padding:25px}
.orb{
margin:auto auto 15px;
border:2px solid #36d9e8;
border-radius:50%;
width:72px;height:72px;
display:grid;place-items:center;
color:#36d9e8;font-size:28px;
box-shadow:0 0 25px #36d9e855
}
h1{letter-spacing:5px;margin:0}
.sub,.date,.note{color:#9bb1c5}
.clock{font-size:30px;margin:15px}
.panel{
background:#0d1b2c;
border:1px solid #21445e;
border-radius:18px;padding:16px
}
#chat{
height:300px;overflow:auto;
display:flex;flex-direction:column;
gap:10px;padding:15px 0
}
.msg{
padding:11px 14px;
border-radius:13px;
max-width:90%;
white-space:pre-wrap
}
.jarvis{background:#102b40;align-self:flex-start}
.user{background:#12404b;align-self:flex-end}
form,.actions{
display:flex;gap:8px;
margin-top:12px;flex-wrap:wrap
}
input{
min-width:0;flex:1;
padding:14px;border-radius:10px;
border:1px solid #28506b;
background:#071421;color:white;
font-size:15px
}
button{
padding:11px 15px;border:0;
border-radius:10px;
background:#36d9e8;
color:#04202a;font-weight:bold;
cursor:pointer
}
.actions button{
background:#16334a;
color:#eaf6ff;
border:1px solid #28506b
}
#voice.active{
background:#087b67;
border-color:#36d9a0
}
.note{
font-size:12px;line-height:1.5;
margin-top:12px
}
</style>
</head>

<body>
<main>
<header class="head">
<div class="orb">J</div>
<h1>J.A.R.V.I.S.</h1>
<div class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
<div class="clock" id="clock"></div>
<div class="date" id="date"></div>
</header>

<section class="panel">
<div id="status" class="sub">Sistema preparado</div>

<div id="chat">
<div class="msg jarvis">
A sus órdenes, Señor. ¿En qué puedo ayudarle?
</div>
</div>

<form id="form">
<input id="prompt" placeholder="Escriba un mensaje..." maxlength="4000">
<button id="send">ENVIAR</button>
</form>

<div class="actions">
<button type="button" id="mic">🎙 Hablar</button>
<button type="button" id="voice">🔊 ACTIVAR VOZ</button>
<button type="button" id="clear">Limpiar</button>
</div>

<div class="note">
La voz utiliza el sistema de audio de su navegador.
La clave API permanece protegida en el servidor.
</div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);

// RELOJ Y FECHA
function clock(){
 const d = new Date();
 $('clock').textContent =
 d.toLocaleTimeString('es-AR');

 $('date').textContent =
 d.toLocaleDateString('es-AR',{
  weekday:'long',
  year:'numeric',
  month:'long',
  day:'numeric'
 });
}
clock();
setInterval(clock,1000);

// HISTORIAL
let history = [];

try{
 history = JSON.parse(
  localStorage.getItem('jarvis_history') || '[]'
 );
}catch(e){}

function add(role,content,save=true){
 const el = document.createElement('div');
 el.className = 'msg ' +
  (role === 'user' ? 'user' : 'jarvis');

 el.textContent = content;
 $('chat').appendChild(el);
 $('chat').scrollTop = $('chat').scrollHeight;

 if(save){
  history.push({role,content});
  history = history.slice(-20);
  localStorage.setItem(
   'jarvis_history',
   JSON.stringify(history)
  );
 }
}

if(history.length){
 $('chat').innerHTML = '';
 history.forEach(m => add(m.role,m.content,false));
}

// SISTEMA DE VOZ
let voice = false;

function speak(text){
 if(!voice || !('speechSynthesis' in window)) return;

 window.speechSynthesis.cancel();

 const utterance = new SpeechSynthesisUtterance(text);
 utterance.lang = 'es-AR';
 utterance.rate = 0.95;
 utterance.pitch = 1;
 utterance.volume = 1;

 window.speechSynthesis.speak(utterance);
}

// BOTÓN DE ACTIVACIÓN DE VOZ
$('voice').onclick = () => {
 if(!('speechSynthesis' in window)){
  add('assistant','Su navegador no admite voz.');
  return;
 }

 voice = !voice;

 if(voice){
  $('voice').textContent = '🔊 VOZ ACTIVADA';
  $('voice').classList.add('active');

  // Prueba de sonido iniciada directamente por el usuario
  speak('Voz de JARVIS activada. A sus órdenes, Señor.');

 }else{
  $('voice').textContent = '🔇 ACTIVAR VOZ';
  $('voice').classList.remove('active');
  window.speechSynthesis.cancel();
 }
};

// LIMPIAR CONVERSACIÓN
$('clear').onclick = () => {
 history = [];
 localStorage.removeItem('jarvis_history');
 $('chat').innerHTML = '';
 add('assistant','Conversación reiniciada, Señor.',false);
};

// CHAT CON OPENAI
$('form').onsubmit = async e => {
 e.preventDefault();

 const t = $('prompt').value.trim();
 if(!t) return;

 $('prompt').value = '';
 add('user',t);

 $('send').disabled = true;
 $('status').textContent = 'Procesando...';

 try{
  const r = await fetch('/.netlify/functions/chat',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
    messages:history.slice(-12)
   })
  });

  const d = await r.json();

  if(!r.ok) throw Error(d.error || 'Error');

  add('assistant',d.reply);
  speak(d.reply);

  $('status').textContent = 'Conectado';

 }catch(err){
  add('assistant','No pude conectarme: '+err.message);
  $('status').textContent = 'Conexión pendiente';

 }finally{
  $('send').disabled = false;
 }
};

// RECONOCIMIENTO DE VOZ
$('mic').onclick = () => {
 const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

 if(!SR){
  add('assistant',
   'El reconocimiento de voz no está disponible en este navegador.'
  );
  return;
 }

 const recognition = new SR();
 recognition.lang = 'es-AR';
 recognition.interimResults = false;

 recognition.onstart = () => {
  $('status').textContent = 'Escuchando...';
 };

 recognition.onresult = e => {
  $('prompt').value =
   e.results[0][0].transcript;

  $('form').requestSubmit();
 };

 recognition.onerror = e => {
  $('status').textContent =
   'Error de micrófono: ' + e.error;
 };

 recognition.onend = () => {
  if($('status').textContent === 'Escuchando...'){
   $('status').textContent = 'Sistema preparado';
  }
 };

 recognition.start();
};
</script>
</body>
</html>
